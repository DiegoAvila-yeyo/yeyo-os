[pytest]
asyncio_mode = auto
markers =
    integration: tests que requieren servicios externos (Ollama, PostgreSQL, etc)
addopts = -m "not integration" --ignore=tests/unit/memory/test_associations.py --ignore=tests/unit/ia/test_anti_hallucination.py --ignore=tests/unit/ia/test_embeddings.py --ignore=tests/unit/ia/test_rag.py
